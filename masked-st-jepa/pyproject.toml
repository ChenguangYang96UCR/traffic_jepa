[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-st-jepa"
version = "0.1.0"
description = "Masked spatio-temporal graph JEPA for traffic sensor imputation"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<3",
  "torch>=2.0",
  "pandas>=1.5",
]

[tool.setuptools]
packages = ["masked_st_jepa"]
